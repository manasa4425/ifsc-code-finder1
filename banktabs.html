<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Navigation | Bank IFSC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0f4c75,#3282b8);
    color:#fff;
}

/* ===== HEADER ===== */
.header{
    display:flex;
    align-items:center;
    padding:15px 20px;
    background:#06283D;
    position:relative;
}

.three-dots{
    font-size:22px;
    cursor:pointer;
    margin-right:15px;
    color:#fff;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#fff;
}

.logo i{
    color:#00FFD1;
}

/* Dropdown */
.dropdown{
    position:absolute;
    top:60px;
    left:20px;
    width:250px;
    background:#0f4c75;
    border-radius:8px;
    display:none;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    overflow:hidden;
    z-index:1000;
}

.dropdown.show{
    display:block;
}

.dropdown a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    color:#fff;
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.15);
    font-size:14px;
}

.dropdown a:hover{
    background:#3282b8;
    padding-left:25px;
}

.dropdown a i{
    width:20px;
    color:#00FFD1;
}

.dropdown a:last-child{
    border-bottom:none;
}

.dropdown a.logout{
    background:#dc3545;
}

.dropdown a.logout:hover{
    background:#c82333;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="three-dots" onClick="toggleMenu()">
        <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

    <div class="logo">
        <i class="fa-solid fa-building-columns"></i> Bank IFSC
    </div>

    <div class="dropdown" id="menu">
        <a href="addaccount.php"><i class="fa fa-user-plus"></i> Add Account</a>
        <a href="Viewaccount.php"><i class="fa fa-eye"></i> View Accounts</a>
        <a href="deposite.php"><i class="fa fa-money-bill"></i> Deposit</a>
        <a href="withdraw.php"><i class="fa fa-hand-holding-dollar"></i> Withdraw</a>
        <a href="transaction.php"><i class="fa fa-exchange-alt"></i> Transaction</a>
        <a href="searchifsc.php"><i class="fa fa-search"></i> Search IFSC</a>
        <a href="alldeatils.php"><i class="fa fa-history"></i> All Details</a>
        <!-- END -->
        <a href="logout.php" class="logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
    </div>

</div>

<script>
function toggleMenu(){
    const menu = document.getElementById("menu");
    menu.classList.toggle('show');
}

document.addEventListener("click", function(e){
    const menu = document.getElementById("menu");
    const dots = document.querySelector(".three-dots");
    if(!menu.contains(e.target) && !dots.contains(e.target)){
        menu.classList.remove('show');
    }
});
</script>

</body>
</html>
